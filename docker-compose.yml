services:
  zwift-connector:
    # Build locally or pull pre-built image from GitHub Container Registry (GHCR)
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/danieletamborrino/dreeve-zwift-connector:latest
    container_name: dreeve-zwift-connector
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8087}:8087"
    env_file:
      - .env
    environment:
      - ZWIFT_EMAIL=${ZWIFT_EMAIL:?ZWIFT_EMAIL is required}
      - ZWIFT_PASSWORD=${ZWIFT_PASSWORD:?ZWIFT_PASSWORD is required}
      - SYNC_TIME_WINDOW=${SYNC_TIME_WINDOW:-1_week}
      - SYNC_CRON=${SYNC_CRON:-0 2 * * *}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=${DATA_DIR:-/data}
    volumes:
      - conf_data:${STATE_DIR:-/data/config}
      - actv_data:${WATCH_DIR:-/data/downloads}

volumes:
  conf_data:
    driver: local
  actv_data:
    driver: local
